<body><div id="site-canvas"><div id="el-0" class="dropped-element"><h2 style="font-size: 58px; color: rgb(0, 0, 0); background-image: url(&quot;https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse1.mm.bing.net%2Fth%2Fid%2FOIP.xbsbMmMq7lEMXX1yqwo8BAHaHa%3Fpid%3DApi&amp;f=1&amp;ipt=05044ec513e14c245c3d4a3ace1bfc530e856fbc0682ff229ea2f6abe61895f3&amp;ipo=images&quot;); background-clip: text; -webkit-text-fill-color: transparent; background-size: cover; background-position: center center;">HTML translator</h2></div><div id="el-1" class="dropped-element"><div style="border: 2px solid rgb(51, 51, 51); background: rgba(0, 0, 0, 0.05); width: 100%; height: 100%; border-radius: 12px;"></div></div><div id="el-2" class="dropped-element"><textarea id="inputCode" placeholder="Enter text..." style="border: 1px solid rgb(204, 204, 204); border-radius: 12px; padding: 10px; width: 100%; height: 100%; resize: none; font-size: 44px; background-image: url(&quot;https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse1.mm.bing.net%2Fth%2Fid%2FOIP.iTNbqDjg-ShWP5Aa7qn7nAHaEK%3Fpid%3DApi&amp;f=1&amp;ipt=943ae0c38d8a8fd72f1777d0e4b61d3224c28cd88b3b120377b29ec11dd8f7da&amp;ipo=images&quot;); background-clip: text; -webkit-text-fill-color: transparent; background-size: cover; background-position: center center;"></textarea></div><div id="el-3" class="dropped-element"><button id="translateBtn" style="background: rgb(79, 70, 229); color: white; border: none; border-radius: 12px; width: 100%; height: 100%; cursor: pointer; font-size: 52px;">Translate</button></div><div id="el-4" class="dropped-element"><div style="border: 2px solid rgb(51, 51, 51); background: rgba(0, 0, 0, 0.05); width: 100%; height: 100%; border-radius: 12px;"></div></div><div id="el-5" class="dropped-element"><div id="outputCode" style="border: 2px solid rgb(51, 51, 51); background: rgba(0, 0, 0, 0.05); width: 100%; height: 100%; border-radius: 12px; overflow-y: auto; padding: 12px; white-space: pre; font-family: monospace; font-size: 14px;">output is in this container</div></div><div id="el-6" class="dropped-element"><button id="copyBtn" style="background: rgb(79, 70, 229); color: white; border: none; border-radius: 12px; width: 100%; height: 100%; cursor: pointer; font-size: 56px;">Copy Button</button></div><div id="el-7" class="dropped-element"><textarea id="notesArea" placeholder="Enter text..." style="border: 1px solid rgb(204, 204, 204); border-radius: 12px; padding: 10px; width: 100%; height: 100%; resize: none; font-size: 14px; background-image: url(&quot;https://about:blank&quot;); background-clip: text; -webkit-text-fill-color: transparent; background-size: cover; background-position: center center;"></textarea></div></div>

<script>
// --- ELEMENTS ---
const inputCode = document.getElementById('inputCode');
const translateBtn = document.getElementById('translateBtn');
const outputCode = document.getElementById('outputCode');
const copyBtn = document.getElementById('copyBtn');
const notesArea = document.getElementById('notesArea');

// --- FORMATTER FUNCTION ---
function formatCode(code) {
    if (!code) return '';

    // Step 1: Decode HTML entities
    let formatted = code
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g, "'")
        .replace(/&amp;/g, '&');

    // Step 2: Minify cleanup + basic indentation
    formatted = formatted
        .replace(/\s+/g, ' ')
        .replace(/>\s*</g, '>\n<')
        .replace(/(<\/\w+>)/g, '$1\n')
        .replace(/(<\w+[^>]*>)/g, '$1\n');

    // Step 3: Indent properly
    let indentLevel = 0;
    const lines = formatted.split('\n').filter(line => line.trim() !== '');
    const indentedLines = lines.map(line => {
        let trimLine = line.trim();

        // Decrease indent for closing tags
        if (trimLine.match(/^<\/\w/)) indentLevel--;

        const indentedLine = '  '.repeat(Math.max(0, indentLevel)) + trimLine;

        // Increase indent for opening tags (not self-closing)
        if (trimLine.match(/^<\w/) && !trimLine.match(/\/>$/) && !trimLine.match(/^<\?/) && !trimLine.match(/^<!/)) indentLevel++;

        // Decrease indent for self-closing or single tags
        if (trimLine.match(/\/>$/) || trimLine.match(/^<!DOCTYPE/) || trimLine.match(/^<meta/) || trimLine.match(/^<link/) || trimLine.match(/^<br/) || trimLine.match(/^<input/)) {
            indentLevel = Math.max(0, indentLevel - 0);
        }

        return indentedLine;
    });

    // Step 4: Separate HTML / CSS / JS clearly
    let finalCode = indentedLines.join('\n');
    finalCode = finalCode
        .replace(/(\<style\>)/g, '\n--- CSS ---\n$1')
        .replace(/(\<\/style\>)/g, '$1\n--- END CSS ---\n')
        .replace(/(\<script\>)/g, '\n--- JAVASCRIPT ---\n$1')
        .replace(/(\<\/script\>)/g, '$1\n--- END JAVASCRIPT ---\n')
        .replace(/^((?!---).)*$/gm, match => match)
        .trim();

    return finalCode;
}

// --- TRANSLATE / FORMAT ACTION ---
translateBtn.addEventListener('click', () => {
    const rawCode = inputCode.value.trim();
    if (!rawCode) {
        outputCode.textContent = '⚠️ Please paste code first!';
        return;
    }
    const result = formatCode(rawCode);
    outputCode.textContent = result;
    notesArea.value = '✅ Cleaned & formatted successfully!\n• Entities decoded\n• Proper indentation\n• Sections labeled: HTML / CSS / JS';
});

// --- COPY ACTION ---
copyBtn.addEventListener('click', () => {
    const textToCopy = outputCode.textContent;
    navigator.clipboard.writeText(textToCopy)
        .then(() => {
            copyBtn.textContent = 'Copied!';
            setTimeout(() => copyBtn.textContent = 'Copy Button', 2000);
        })
        .catch(() => {
            outputCode.textContent += '\n❌ Copy failed — please copy manually.';
        });
});
</script>
