<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin:0; padding:0; width:100%; min-height:100%; overflow-x:hidden; background:#fff; font-family: sans-serif; }
        #site-canvas { position:relative; width:100%; max-width:1440px; height:1800px; background-color:rgb(60, 78, 107); background-image:none; background-size:cover; background-position:center; margin:0 auto; overflow:hidden; }
        .dropped-element { position:absolute; display:flex; align-items:center; justify-content:center; box-sizing: border-box; transition: opacity 0.2s; }
        .dropped-element > * { width:100%; height:100%; object-fit:cover; border-radius:12px; border:none; margin:0; box-sizing: border-box; }
        textarea { resize: none; box-sizing: border-box; padding: 10px; }
        button { cursor: pointer; transition: transform 0.1s; background-size: cover; background-position: center; }
        button:active { transform: scale(0.98); }

 }
        @media (max-width: 600px) { #site-canvas { width: 100vw; max-width: 100vw; } #el-0 { left:16.2667%; top:18px; width:158.0424%; height:145.239px; z-index:40 !important; opacity:1; }
#el-0 > * { font-size:67px !important; }
#el-1 { left:56.2667%; top:218px; width:231.2939%; height:1347.23px; z-index:10 !important; opacity:1; }
#el-2 { left:73.3333%; top:1443px; width:156.2339%; height:62.5573px; z-index:40 !important; opacity:0.52; }
#el-2 > * { font-size:40px !important; }
#el-3 { left:243.4667%; top:1440px; width:23.1732%; height:64.8979px; z-index:30 !important; opacity:1; }
#el-3 > * { font-size:43px !important; }
#el-4 { left:76.8000%; top:281px; width:197.8256%; height:1120.29px; z-index:10 !important; opacity:1; }
 }

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-analytics.js"></script>
</head>
<body>
<div id="site-canvas">
    <div id="el-0" class="dropped-element"><h2 style="font-size: 67px; color: rgb(0, 0, 0); background-image: url(&quot;https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse1.mm.bing.net%2Fth%2Fid%2FOIP.vqQKZNutKJPoMSw2QyA-5AHaEK%3Fr%3D0%26pid%3DApi&amp;f=1&amp;ipt=9c319f106a73b59946b755f69237c0a5c7e926322bdc2c67e8c54b59d0f66e2e&amp;ipo=images&quot;); background-clip: text; -webkit-text-fill-color: transparent; background-size: cover; background-position: center center;">Public Chatroom</h2></div>
    <div id="el-1" class="dropped-element"><div style="border: 2px solid rgb(51, 51, 51); background: rgba(0, 0, 0, 0.05); width: 100%; height: 100%; border-radius: 12px;"></div></div>
    <div id="el-2" class="dropped-element"><textarea id="messageInput" placeholder="Enter text..." style="border: 1px solid rgb(204, 204, 204); border-radius: 12px; padding: 10px; width: 100%; height: 100%; resize: none; font-size: 40px;"></textarea></div>
    <div id="el-3" class="dropped-element"><button id="sendBtn" style="background: none rgba(58, 156, 58, 0.8); color: white; border: none; border-radius: 12px; width: 100%; height: 100%; cursor: pointer; font-size: 43px;">⫸</button></div>
    <div id="el-4" class="dropped-element"><div id="messageContainer" style="border: 2px solid rgb(51, 51, 51); background: rgba(0, 0, 0, 0.05); width: 100%; height: 100%; border-radius: 12px; overflow-y: auto; padding: 10px; box-sizing: border-box;"></div></div>
</div>

<script>
// Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBZG26OmqR_DwV9UKCVQuRE3JzCy6SleAs",
  authDomain: "dragndrop-eeda4.firebaseapp.com",
  databaseURL: "https://dragndrop-eeda4-default-rtdb.firebaseio.com",
  projectId: "dragndrop-eeda4",
  storageBucket: "dragndrop-eeda4.firebasestorage.app",
  messagingSenderId: "124148111401",
  appId: "1:124148111401:web:95011428420e219497e438",
  measurementId: "G-L6NJ4Y36QW"
};

// Initialize Firebase
const app = firebase.initializeApp(firebaseConfig);
const analytics = firebase.analytics(app);
const db = firebase.database(app);
const messagesRef = db.ref("messages");

// Elements
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const messageContainer = document.getElementById("messageContainer");

// Send message
sendBtn.addEventListener("click", () => {
  const text = messageInput.value.trim();
  if (text !== "") {
    messagesRef.push({
      text: text,
      timestamp: Date.now()
    });
    messageInput.value = "";
  }
});

// Enter key send
messageInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    sendBtn.click();
  }
});

// Receive & display messages
messagesRef.orderByChild("timestamp").on("value", (snapshot) => {
  messageContainer.innerHTML = "";
  const messages = snapshot.val();
  if (messages) {
    Object.values(messages).forEach(msg => {
      const msgEl = document.createElement("div");
      msgEl.style.cssText = "margin: 6px 0; padding: 8px 12px; background: rgba(255,255,255,0.8); border-radius: 8px; font-size: 20px;";
      msgEl.textContent = msg.text;
      messageContainer.appendChild(msgEl);
    });
    // Auto scroll to bottom
    messageContainer.scrollTop = messageContainer.scrollHeight;
  }
});
</script>
</body>
</html>
